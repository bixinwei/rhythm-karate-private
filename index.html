<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no" />
    <title>空手道节拍 · Rhythm Tengoku Web</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="console">
      <section id="menu" class="menu screen">
        <h1>空手道家</h1>
        <button id="startBtn" class="start">开始游戏</button>
      </section>
      <section id="game" class="screen hidden">
        <div class="screens">
          <div class="upper">
          <canvas id="stage" width="960" height="640"></canvas>
            <div id="upperFlash"></div>
          </div>
          <div class="hinge"><span></span><span></span><span></span></div>
          <aside class="lower">
          <canvas id="lower" width="640" height="480"></canvas>
          </aside>
        </div>
      </section>
    </main>
  <script src="game.js?v=gba-local-55"></script>
  </body>
