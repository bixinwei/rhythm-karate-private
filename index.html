<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no" />
    <title>空手道节拍 · Rhythm Tengoku Web</title>
    <link rel="stylesheet" href="style.css?v=tweezers-audio-4" />
  </head>
  <body>
    <main class="console">
      <section id="menu" class="menu screen">
        <h1>节奏天国</h1>
        <div class="menu-actions">
          <button id="startBtn" class="start">空手道家</button>
          <button id="tweezersBtn" class="start secondary">拔毛</button>
        </div>
        <div id="tweezersPreview" class="voice-candidates" aria-label="拔毛原版音效试听">
          <span>拔毛音效试听：</span>
          <button data-tw-sfx="appear">短毛出现</button>
          <button data-tw-sfx="long_appear">长毛出现</button>
          <button data-tw-sfx="hit">短毛拔除</button>
          <button data-tw-sfx="barely">短毛擦边</button>
          <button data-tw-sfx="long_hit">长毛命中</button>
          <button data-tw-sfx="long_pull">长毛拉出</button>
          <button data-tw-sfx="next">蔬菜过场</button>
        </div>
      </section>
      <section id="game" class="screen hidden">
        <div class="screens">
          <div class="upper">
          <canvas id="stage" width="960" height="640"></canvas>
            <div id="upperFlash"></div>
          </div>
          <div class="hinge"><span></span><span></span><span></span></div>
          <aside class="lower">
          <canvas id="lower" width="640" height="480"></canvas>
          </aside>
        </div>
      </section>
    </main>
  <script src="game.js?v=gba-tweezers-audio-7"></script>
  </body>
</html>
