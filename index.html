<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no" />
    <title>空手道节拍 · Rhythm Tengoku Web</title>
    <link rel="stylesheet" href="style.css?v=tweezers-audio-5" />
  </head>
  <body>
    <main class="console">
      <section id="menu" class="menu screen">
        <h1>节奏天国</h1>
        <div class="menu-actions">
          <button id="startBtn" class="start">空手道家</button>
          <button id="tweezersBtn" class="start secondary">拔毛</button>
          <button id="spaceballBtn" class="start secondary">Air Batter</button>
          <button id="samuraiBtn" class="start secondary">Samurai Slice</button>
          <button id="nightWalkBtn" class="start secondary">Night Walk</button>
          <button id="calligraphyBtn" class="start secondary">Power Calligraphy</button>
        </div>
      </section>
      <section id="game" class="screen hidden">
        <div class="screens">
          <div class="upper">
          <canvas id="stage" width="960" height="640"></canvas>
            <div id="upperFlash"></div>
          </div>
          <div class="hinge"><span></span><span></span><span></span></div>
          <aside class="lower">
          <canvas id="lower" width="640" height="480"></canvas>
          </aside>
        </div>
      </section>
    </main>
  <script src="game.js?v=gba-tweezers-audio-25"></script>
  </body>
</html>
